[package]
name = "kernel_architect"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1.36", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"

[profile.release]
lto = true
codegen-units = 1
